<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify Connection</title>
    <script src="env-config.js"></script>
    <style>
        body {
            background: #0f172a;
            color: #e2e8f0;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            gap: 20px;
        }
        h2 { color: #38bdf8; }
        p { color: #94a3b8; font-size: 14px; text-align: center; max-width: 400px; }
        a {
            background: #2563eb;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            letter-spacing: 1px;
        }
        a:hover { background: #3b82f6; }
    </style>
</head>
<body>
    <h2>⚠ SECURE CONNECTION REQUIRED</h2>
    <p>You need to trust the server certificate before continuing. Click the button below, then click <strong>"Accept the Risk and Continue"</strong> on the next page.</p>
    <a id="trust-link" href="#">VERIFY & TRUST CONNECTION</a>
    <p style="font-size:11px">You will be redirected back to login automatically.</p>
    <script>
        const base = window.SERVER_API_URL.replace('/api', '');
        document.getElementById('trust-link').href = base + '/trust';
    </script>
</body>
</html>
