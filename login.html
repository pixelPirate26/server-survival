<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SERVER: Survival Protocol - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
    <style>
        /* Specific animations for the login page */
        .scan-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: rgba(56, 189, 248, 0.5);
            animation: scan 3s linear infinite;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
        }
        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        .login-bg-grid {
            background-image: 
                linear-gradient(rgba(26, 26, 26, 0.5) 1px, transparent 1px),
                linear-gradient(90deg, rgba(26, 26, 26, 0.5) 1px, transparent 1px);
            background-size: 30px 30px;
            width: 100%;
            height: 100%;
            position: absolute;
            z-index: -1;
            perspective: 1000px;
            transform: perspective(500px) rotateX(20deg) scale(1.5);
            opacity: 0.3;
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen overflow-hidden relative">
    
    <div class="login-bg-grid"></div>
    <div class="scan-line"></div>

    <div class="glass-panel p-8 rounded-2xl w-full max-w-md border border-gray-700 shadow-[0_0_50px_rgba(0,0,0,0.5)] relative z-10">
        
        <div class="text-center mb-8">
            <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-300 tracking-tighter filter drop-shadow-[0_0_10px_rgba(59,130,246,0.5)] mb-2">
                SERVER<br />SURVIVAL
            </h1>
            <div class="flex items-center justify-center gap-2 text-xs font-mono text-gray-400">
                <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
                <span>RESTRICTED ACCESS</span>
            </div>
        </div>

        <form id="login-form" class="space-y-6">
            <div class="space-y-2">
                <label for="username" class="text-xs font-bold text-gray-500 uppercase tracking-wider ml-1">Username</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-500 group-focus-within:text-cyan-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                    </div>
                    <input type="text" id="username" name="username" required
                        class="block w-full pl-10 pr-3 py-3 border border-gray-700 rounded-lg leading-5 bg-gray-900/50 text-gray-300 placeholder-gray-600 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 sm:text-sm transition-all duration-200 font-mono"
                        placeholder="player1">
                </div>
            </div>

            <div class="space-y-2">
                <label for="password" class="text-xs font-bold text-gray-500 uppercase tracking-wider ml-1">Access Key</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-500 group-focus-within:text-cyan-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                    </div>
                    <input type="password" id="password" name="password" required
                        class="block w-full pl-10 pr-3 py-3 border border-gray-700 rounded-lg leading-5 bg-gray-900/50 text-gray-300 placeholder-gray-600 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 sm:text-sm transition-all duration-200 font-mono"
                        placeholder="••••••••">
                </div>
            </div>

            <div id="error-msg" class="hidden bg-red-900/30 border border-red-500/50 rounded p-3 flex items-center gap-2 text-red-200 text-xs font-mono animate-pulse">
                <svg class="w-4 h-4 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span id="error-text">Authentication Failed</span>
            </div>

            <button type="submit" id="login-btn"
                class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-bold text-white bg-blue-600 hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all duration-200 uppercase font-mono tracking-wider hover:shadow-[0_0_15px_rgba(37,99,235,0.5)]">
                Initialize Connection
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-[10px] text-gray-600 font-mono">
                SECURE TERMINAL v2.1 // AUTHORIZED PERSONNEL ONLY
            </p>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
